name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  notify-homino:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Notify homino of new release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMINO_DISPATCH_TOKEN }}
          repository: majamassarini/homino
          event-type: release-published
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'
